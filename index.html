<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phillies 스탑워치</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .scoreboard {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(#10261a, #07140d); border: 3px solid #2b2b2b; outline: 2px solid #c9c9c9;
    border-radius: 6px; padding: 8px 18px; display: flex; gap: 22px; align-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.6), inset 0 0 18px rgba(0,0,0,.7);
    font-family: "Consolas", monospace; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,214,90,.7);
    color: #ffd65a; white-space: nowrap;
  }
  .scoreboard .team { display: flex; gap: 10px; align-items: baseline; }
  .scoreboard .name { color: #fff; font-weight: 700; text-shadow: none; }
  .scoreboard .runs { font-size: 28px; min-width: 28px; text-align: right; }
  .scoreboard .inn { font-size: 14px; color: #bde; text-shadow: none; }
  .scoreboard .inn b { font-size: 22px; color: #ffd65a; text-shadow: 0 0 8px rgba(255,214,90,.7); }

  .panel {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: min(440px, 92vw); text-align: center; padding: 12px 18px 16px;
    background: rgba(10, 12, 20, .62); border: 1px solid rgba(255,255,255,.18); border-radius: 18px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,.55);
  }
  @media (min-width: 900px) { .panel { left: 24px; transform: none; bottom: 24px; } }
  .time { font-size: clamp(42px, 11vw, 66px); font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 10px;
    text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  .time small { font-size: .5em; color: #d9dfee; }
  .btns { display: flex; gap: 10px; }
  button { flex: 1; padding: 12px 0; font-size: 16px; font-weight: 600; border: 0; border-radius: 10px;
    cursor: pointer; color: #fff; background: rgba(255,255,255,.14); transition: filter .15s, transform .05s; }
  button:hover { filter: brightness(1.25); }
  button:active { transform: scale(.97); }
  #start { background: #E81828; }               /* Phillies red */
  #start.running { background: #002D72; }       /* Phillies blue */
  #lap:disabled { opacity: .4; cursor: default; }
  .hint { margin-top: 8px; font-size: 12px; color: #b8c0d6; }

  .laps { position: fixed; top: 14px; right: 14px; width: 210px; max-height: 40vh; overflow-y: auto;
    list-style: none; margin: 0; padding: 0; background: rgba(10,12,20,.55); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; font-variant-numeric: tabular-nums; }
  .laps:empty { display: none; }
  .laps li { display: flex; justify-content: space-between; padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .laps li span:first-child { color: #aab; }

  .banner { position: fixed; top: 24%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    text-align: center; pointer-events: none; font-weight: 900; letter-spacing: 3px; font-style: italic;
    font-size: clamp(34px, 9vw, 92px); color: #fff; text-transform: uppercase; white-space: nowrap;
    text-shadow: 0 0 0 #E81828, 3px 3px 0 #E81828, 6px 6px 0 #002D72, 0 10px 30px rgba(0,0,0,.7); }
  .banner small { display: block; font-size: .28em; letter-spacing: 6px; font-style: normal; margin-top: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .banner.show { animation: pop 3.6s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
    10% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    18% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -62%) scale(1); }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="scoreboard">
  <div class="team"><span class="name">PHI</span><span class="runs" id="phi">0</span></div>
  <div class="inn">INNING <b id="inn">1</b></div>
  <div class="team"><span class="name">OPP</span><span class="runs" id="opp">0</span></div>
</div>

<ol class="laps" id="laps"></ol>
<div class="banner" id="banner"></div>

<div class="panel">
  <div class="time" id="display">00:00:00<small>.00</small></div>
  <div class="btns">
    <button id="lap" disabled>랩</button>
    <button id="start">시작</button>
    <button id="reset">초기화</button>
  </div>
  <div class="hint">1분마다 1이닝 진행 · 스페이스 시작/정지 · L 랩 · R 초기화</div>
</div>

<script>
/* ================= 스탑워치 / 경기 상태 ================= */
const $ = id => document.getElementById(id);
const display = $('display'), startBtn = $('start'), lapBtn = $('lap'), resetBtn = $('reset'), lapsEl = $('laps');
let elapsed = 0, startedAt = 0, timer = null, lastLap = 0, lapCount = 0;
let inning = 1, phi = 0, opp = 0, lastMinute = 0, gameOver = false;

const pad = (n, l = 2) => String(n).padStart(l, '0');
function format(ms) {
  return { main: `${pad(Math.floor(ms / 3600000))}:${pad(Math.floor(ms / 60000) % 60)}:${pad(Math.floor(ms / 1000) % 60)}`,
           cs: pad(Math.floor(ms / 10) % 100) };
}
function render() { const t = format(elapsed); display.innerHTML = `${t.main}<small>.${t.cs}</small>`; }
function tick() {
  elapsed = performance.now() - startedAt;
  render();
  const m = Math.floor(elapsed / 60000);
  while (lastMinute < m) { lastMinute++; onMinute(lastMinute); }
}
function toggle() {
  if (timer === null) {
    startedAt = performance.now() - elapsed;
    timer = setInterval(tick, 10);
    startBtn.textContent = '정지'; startBtn.classList.add('running'); lapBtn.disabled = false;
  } else {
    clearInterval(timer); timer = null; tick();
    startBtn.textContent = '계속'; startBtn.classList.remove('running'); lapBtn.disabled = true;
  }
}
function lap() {
  if (timer === null) return;
  const t = format(elapsed), d = format(elapsed - lastLap); lastLap = elapsed;
  const li = document.createElement('li');
  li.innerHTML = `<span>랩 ${++lapCount}</span><span>+${d.main}.${d.cs}</span>`;
  lapsEl.prepend(li);
}
function reset() {
  clearInterval(timer); timer = null;
  elapsed = 0; lastLap = 0; lapCount = 0; lastMinute = 0;
  inning = 1; phi = 0; opp = 0; gameOver = false;
  lapsEl.innerHTML = '';
  startBtn.textContent = '시작'; startBtn.classList.remove('running'); lapBtn.disabled = true;
  Fx.clear(); updateBoard(); render();
}
function updateBoard() { $('inn').textContent = inning; $('phi').textContent = phi; $('opp').textContent = opp; }

startBtn.onclick = toggle; lapBtn.onclick = lap; resetBtn.onclick = reset;
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'l' || e.key === 'L') lap();
  else if (e.key === 'r' || e.key === 'R') reset();
});

/* ================= 구장 배경 (코드로 그린 CBP) ================= */
const cv = $('stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, bg = null, DPR = 1;
const geo = {};   // 장면 기준 좌표

function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function buildScene() {
  bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const c = bg.getContext('2d'), R = rnd(20260);
  const horizon = H * 0.44, wallTop = H * 0.40;
  Object.assign(geo, { horizon, wallTop, standTop: H * 0.13 });

  /* 하늘: 황혼 그라데이션 */
  let g = c.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#0b1230'); g.addColorStop(.45, '#2a2f63'); g.addColorStop(.75, '#8a5a82'); g.addColorStop(1, '#e8a06a');
  c.fillStyle = g; c.fillRect(0, 0, W, horizon);
  // 별
  for (let i = 0; i < 90; i++) { c.fillStyle = `rgba(255,255,255,${R() * .6})`; c.fillRect(R() * W, R() * H * .16, 1.2, 1.2); }
  // 구름
  for (let i = 0; i < 7; i++) {
    const cx = R() * W, cy = H * (.05 + R() * .12);
    const cg = c.createRadialGradient(cx, cy, 0, cx, cy, W * .14);
    cg.addColorStop(0, 'rgba(255,190,170,.22)'); cg.addColorStop(1, 'rgba(255,190,170,0)');
    c.fillStyle = cg; c.fillRect(cx - W * .14, cy - H * .08, W * .28, H * .16);
  }

  /* 필라델피아 스카이라인 (우측 외야 너머) */
  const skyBase = H * 0.26;
  c.fillStyle = '#1b1f3d';
  let x = W * 0.55;
  const towers = [[.04,.10],[.025,.15],[.035,.22],[.03,.12],[.045,.30],[.03,.18],[.04,.26],[.03,.13],[.035,.2],[.03,.1]];
  towers.forEach(([w, h]) => {
    const tw = W * w, th = H * h;
    c.fillStyle = '#1a1e3b'; c.fillRect(x, skyBase - th, tw, th + 4);
    c.fillStyle = 'rgba(255,225,150,.55)';
    for (let yy = skyBase - th + 6; yy < skyBase - 4; yy += 7)
      for (let xx = x + 3; xx < x + tw - 3; xx += 6) if (R() > .55) c.fillRect(xx, yy, 2, 3);
    x += tw + W * .004;
  });
  // Comcast 타워 풍 첨탑
  c.fillStyle = '#20254a'; c.fillRect(W * .72, skyBase - H * .34, W * .028, H * .34);
  c.fillStyle = '#9fd0ff'; c.fillRect(W * .72 + 2, skyBase - H * .34, W * .028 - 4, 3);

  /* 관중석 (상단/하단 데크) */
  const standBottom = wallTop;
  const decks = [
    { y0: H * .13, y1: H * .24, base: '#161a2c' },     // 상단
    { y0: H * .255, y1: H * .335, base: '#1e2238' },   // 중단
    { y0: H * .345, y1: wallTop,  base: '#262a42' }    // 하단
  ];
  decks.forEach((d, di) => {
    const gg = c.createLinearGradient(0, d.y0, 0, d.y1);
    gg.addColorStop(0, d.base); gg.addColorStop(1, '#0d1020');
    c.fillStyle = gg; c.fillRect(0, d.y0, W, d.y1 - d.y0);
    // 좌석 줄 + 관중
    const rows = 9 + di * 2, rh = (d.y1 - d.y0) / rows;
    for (let r = 0; r < rows; r++) {
      const yy = d.y0 + r * rh, size = 2 + r * .18 + di * .6;
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, yy + rh - 1, W, 1.5);
      for (let xx = R() * 5; xx < W; xx += size * 1.9) {
        const p = R();
        let col = p < .46 ? `rgb(${170 + R() * 70 | 0},${15 + R() * 30 | 0},${25 + R() * 30 | 0})`   // 레드 유니폼
                : p < .6 ? `rgb(${210 + R() * 40 | 0},${210 + R() * 40 | 0},${210 + R() * 40 | 0})`
                : p < .7 ? `rgb(${0},${35 + R() * 30 | 0},${100 + R() * 40 | 0})`                      // 블루
                : `rgb(${40 + R() * 70 | 0},${35 + R() * 55 | 0},${40 + R() * 55 | 0})`;
        c.fillStyle = col; c.fillRect(xx, yy + rh * .25, size, rh * .7);
        c.fillStyle = `rgb(${190 + R() * 40 | 0},${150 + R() * 40 | 0},${120 + R() * 30 | 0})`;   // 얼굴
        c.beginPath(); c.arc(xx + size / 2, yy + rh * .2, size * .38, 0, 7); c.fill();
      }
    }
    // 데크 난간
    c.fillStyle = '#05060c'; c.fillRect(0, d.y1 - 2, W, 3);
  });
  geo.decks = decks;

  /* 센터필드 스코어보드 + 리버티벨 구조물 */
  const sbW = W * .2, sbH = H * .1, sbX = W * .5 - sbW / 2, sbY = H * .205;
  const sg = c.createLinearGradient(0, sbY, 0, sbY + sbH);
  sg.addColorStop(0, '#0d3a21'); sg.addColorStop(1, '#04160c');
  c.fillStyle = '#111'; c.fillRect(sbX - 6, sbY - 6, sbW + 12, sbH + 12);
  c.fillStyle = sg; c.fillRect(sbX, sbY, sbW, sbH);
  c.fillStyle = 'rgba(255,255,255,.55)'; c.font = `700 ${sbH * .2}px sans-serif`; c.textAlign = 'center';
  c.fillText('PHILLIES', sbX + sbW / 2, sbY + sbH * .35);
  c.fillStyle = '#E81828'; c.fillRect(sbX + 8, sbY + sbH * .5, sbW - 16, 3);
  c.fillStyle = '#ffd65a'; c.font = `700 ${sbH * .22}px monospace`;
  c.fillText('CITIZENS BANK PARK', sbX + sbW / 2, sbY + sbH * .82);
  geo.bell = { x: W * .5, y: H * .17 };   // 리버티벨은 동적으로 그림

  /* 외야 펜스 */
  const wg = c.createLinearGradient(0, wallTop, 0, horizon);
  wg.addColorStop(0, '#0f3d2a'); wg.addColorStop(1, '#082016');
  c.fillStyle = wg; c.fillRect(0, wallTop, W, horizon - wallTop);
  c.fillStyle = '#f3d03a'; c.fillRect(0, wallTop, W, 3);              // 노란 라인
  c.fillStyle = 'rgba(255,255,255,.07)';
  for (let xx = 0; xx < W; xx += W / 24) c.fillRect(xx, wallTop, 2, horizon - wallTop);
  // 광고 패널
  const ads = ['#E81828', '#002D72', '#f2f2f2', '#c9a227'];
  for (let xx = 8; xx < W; xx += W / 12) {
    c.fillStyle = ads[(xx / (W / 12) | 0) % 4]; c.globalAlpha = .75;
    c.fillRect(xx, wallTop + 8, W / 12 - 16, (horizon - wallTop) - 14); c.globalAlpha = 1;
  }

  /* 잔디 + 모잉 스트라이프 (원근) */
  let gr = c.createLinearGradient(0, horizon, 0, H);
  gr.addColorStop(0, '#1f5a24'); gr.addColorStop(1, '#2f7a2c');
  c.fillStyle = gr; c.fillRect(0, horizon, W, H - horizon);
  let y = horizon, band = 4, flip = false;
  while (y < H) {
    c.fillStyle = flip ? 'rgba(0,0,0,.13)' : 'rgba(255,255,255,.05)';
    c.fillRect(0, y, W, band); y += band; band *= 1.13; flip = !flip;
  }

  /* 내야 (홈 뒤에서 본 시점) */
  const home = [W * .5, H * .95], first = [W * .78, H * .735], second = [W * .5, H * .585], third = [W * .22, H * .735];
  geo.diamond = { home, first, second, third };
  // 흙 (둥근 내야)
  c.save();
  const dirt = c.createRadialGradient(W * .5, H * .76, 10, W * .5, H * .76, W * .34);
  dirt.addColorStop(0, '#b9825a'); dirt.addColorStop(.7, '#a56f48'); dirt.addColorStop(1, '#8a5836');
  c.fillStyle = dirt;
  c.beginPath(); c.ellipse(W * .5, H * .78, W * .31, H * .2, 0, 0, 7); c.fill();
  // 안쪽 잔디
  const ig = c.createLinearGradient(0, H * .62, 0, H * .9);
  ig.addColorStop(0, '#2f7f2d'); ig.addColorStop(1, '#3a9034');
  c.fillStyle = ig;
  const cx0 = (home[0] + second[0]) / 2, cy0 = (home[1] + second[1]) / 2;
  const inset = p => [p[0] + (cx0 - p[0]) * .22, p[1] + (cy0 - p[1]) * .22];
  c.beginPath();
  [home, first, second, third].map(inset).forEach((p, i) => i ? c.lineTo(...p) : c.moveTo(...p));
  c.closePath(); c.fill();
  // 파울 라인
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(...home); c.lineTo(W * 1.05, H * .6); c.moveTo(...home); c.lineTo(-W * .05, H * .6); c.stroke();
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.85)';
  c.beginPath(); c.moveTo(...home); c.lineTo(...first); c.lineTo(...second); c.lineTo(...third); c.closePath(); c.stroke();
  // 마운드
  const mg = c.createRadialGradient(W * .5, H * .76, 2, W * .5, H * .76, W * .05);
  mg.addColorStop(0, '#c0895f'); mg.addColorStop(1, 'rgba(165,111,72,0)');
  c.fillStyle = mg; c.beginPath(); c.ellipse(W * .5, H * .76, W * .05, H * .028, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.fillRect(W * .5 - 10, H * .757, 20, 3);
  // 베이스
  [first, second, third].forEach(([bx, by]) => {
    c.save(); c.translate(bx, by); c.rotate(Math.PI / 4); c.scale(1, .55);
    c.fillStyle = '#fafafa'; c.fillRect(-9, -9, 18, 18); c.restore();
  });
  // 홈 플레이트
  c.fillStyle = '#fff'; c.beginPath();
  c.moveTo(home[0] - 14, home[1] - 8); c.lineTo(home[0] + 14, home[1] - 8); c.lineTo(home[0] + 14, home[1] - 1);
  c.lineTo(home[0], home[1] + 8); c.lineTo(home[0] - 14, home[1] - 1); c.closePath(); c.fill();
  // 타석 박스 흙
  c.fillStyle = 'rgba(120,75,45,.7)';
  c.fillRect(home[0] - 90, home[1] - 40, 55, 70); c.fillRect(home[0] + 35, home[1] - 40, 55, 70);
  c.restore();

  /* 조명탑 */
  [[.08, .0], [.92, .0]].forEach(([px]) => {
    const tx = W * px;
    c.fillStyle = '#23263a'; c.fillRect(tx - 4, H * .02, 8, horizon - H * .02);
    c.fillStyle = '#2b2f47'; c.fillRect(tx - W * .035, H * .01, W * .07, H * .08);
    for (let r = 0; r < 4; r++) for (let k = 0; k < 8; k++) {
      const lx = tx - W * .031 + k * W * .0085, ly = H * .018 + r * H * .018;
      const lg = c.createRadialGradient(lx, ly, 0, lx, ly, 14);
      lg.addColorStop(0, 'rgba(255,255,240,1)'); lg.addColorStop(.25, 'rgba(255,250,215,.8)'); lg.addColorStop(1, 'rgba(255,250,215,0)');
      c.fillStyle = lg; c.fillRect(lx - 14, ly - 14, 28, 28);
    }
    const gl = c.createRadialGradient(tx, H * .05, 5, tx, H * .05, W * .18);
    gl.addColorStop(0, 'rgba(255,245,200,.28)'); gl.addColorStop(1, 'rgba(255,245,200,0)');
    c.fillStyle = gl; c.fillRect(0, 0, W, horizon);
  });

  /* 조명 반사광 + 비네팅 + 필름 그레인 */
  const sheen = c.createRadialGradient(W * .5, H * .7, 0, W * .5, H * .7, W * .6);
  sheen.addColorStop(0, 'rgba(255,255,220,.08)'); sheen.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sheen; c.fillRect(0, horizon, W, H - horizon);
  const vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.65)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  const img = c.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  c.putImageData(img, 0, 0);
}

/* ================= 이벤트 연출 (3단계에서 구현) ================= */
const Fx = {
  list: [], parts: [], bellT: -1e9, bellAmp: 0,
  clear() { this.list = []; this.parts = []; this.bellAmp = 0; $('banner').classList.remove('show'); },
  add(type, dur, extra = {}) { this.list.push({ type, dur, t0: performance.now(), ...extra }); },
  burst(x, y, hue) {
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * 7, s = 1.5 + Math.random() * 4.5;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: hue + Math.random() * 30 });
    }
  },
  bell() { this.bellT = performance.now(); this.bellAmp = .55; }
};

function banner(title, sub) {
  const b = $('banner');
  b.innerHTML = `${title}<small>${sub || ''}</small>`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

const EVENTS = [
  { name: 'homerun', run() {
      const r = 1 + Math.floor(Math.random() * 3); phi += r;
      banner('Home Run!', `Phillies +${r} · Ring the Liberty Bell`);
      Fx.add('ball', 1900); Fx.bell();
      for (let i = 0; i < 7; i++) setTimeout(() => Fx.burst(W * (.15 + Math.random() * .7), H * (.04 + Math.random() * .16), [0, 215, 45][i % 3]), 1500 + i * 450);
  } },
  { name: 'wave', run() { banner('The Wave', 'Citizens Bank Park is on its feet'); Fx.add('wave', 6000); } },
  { name: 'phanatic', run() { banner('Phanatic!', 'Hey, who invited the big green guy?'); Fx.add('phanatic', 9000); } },
  { name: 'towels', run() {
      phi += 1; banner('Red October', 'Wave those towels · Phillies +1'); Fx.add('towels', 6500);
  } },
  { name: 'lights', run() { banner('Light Show', 'Dancing on our own'); Fx.add('lights', 7000); } }
];
let lastEvent = -1;

function onMinute(m) {
  if (m >= 9) {
    if (gameOver) return;
    gameOver = true; inning = 9; phi = Math.max(phi, opp + 1); updateBoard();
    banner('Phillies Win!', `Final · PHI ${phi} – OPP ${opp}`);
    Fx.bell();
    for (let i = 0; i < 14; i++) setTimeout(() => Fx.burst(W * (.1 + Math.random() * .8), H * (.04 + Math.random() * .18), Math.random() * 360), i * 350);
    return;
  }
  if (gameOver) return;
  inning = m + 1;
  if (Math.random() < .3) opp++;
  let i; do { i = Math.floor(Math.random() * EVENTS.length); } while (i === lastEvent);
  lastEvent = i; EVENTS[i].run(); updateBoard();
}

/* ================= 메인 루프 ================= */
function resize() {
  DPR = 1;
  W = cv.width = Math.floor(innerWidth * DPR); H = cv.height = Math.floor(innerHeight * DPR);
  buildScene();
}
function drawBell(now) {
  const { x, y } = geo.bell, s = H * .075, el = (now - Fx.bellT) / 1000;
  const ang = Fx.bellAmp * Math.exp(-el * .9) * Math.sin(el * 7);
  ctx.save(); ctx.translate(x, y - s * .55); ctx.rotate(ang);
  ctx.fillStyle = '#3a2a12'; ctx.fillRect(-s * .5, -4, s, 5);
  const g = ctx.createLinearGradient(-s * .5, 0, s * .5, 0);
  g.addColorStop(0, '#6b4a1a'); g.addColorStop(.35, '#d9a94a'); g.addColorStop(.6, '#9c7230'); g.addColorStop(1, '#4a3212');
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(-s * .12, 0); ctx.quadraticCurveTo(-s * .2, s * .5, -s * .5, s * .95);
  ctx.lineTo(s * .5, s * .95); ctx.quadraticCurveTo(s * .2, s * .5, s * .12, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2a1c0a'; ctx.lineWidth = 2; ctx.beginPath();     // 균열
  ctx.moveTo(s * .08, s * .9); ctx.lineTo(s * .02, s * .55); ctx.lineTo(s * .1, s * .3); ctx.stroke();
  ctx.restore();
}

function frame() {
  const now = performance.now();
  ctx.drawImage(bg, 0, 0);
  drawBell(now);

  const standH = geo.wallTop - geo.standTop;
  Fx.list = Fx.list.filter(e => now - e.t0 < e.dur);
  for (const e of Fx.list) {
    const t = (now - e.t0) / e.dur;

    if (e.type === 'wave') {                         // 관중 파도: 띠가 지나가며 일어섬
      const bw = W * .2, px = -bw + t * (W + bw * 2);
      for (let sx = Math.max(0, px); sx < Math.min(W, px + bw); sx += 6) {
        const k = Math.sin(((sx - px) / bw) * Math.PI);
        ctx.globalAlpha = .9;
        ctx.drawImage(bg, sx, geo.standTop, 6, standH, sx, geo.standTop - k * 9, 6, standH);
        ctx.globalAlpha = k * .22; ctx.fillStyle = '#fff'; ctx.fillRect(sx, geo.standTop - k * 9, 6, standH);
      }
      ctx.globalAlpha = 1;
    }

    if (e.type === 'towels') {                       // 레드 옥토버 응원 타월
      const fade = Math.min(1, t * 8, (1 - t) * 4);
      ctx.fillStyle = `rgba(232,24,40,${.1 * fade})`; ctx.fillRect(0, geo.standTop, W, standH);
      for (let i = 0; i < 260; i++) {
        const jig = Math.sin(now / 90 + i) * 4 * fade;
        ctx.fillStyle = i % 3 ? '#fff' : '#E81828'; ctx.globalAlpha = .85 * fade;
        ctx.fillRect(((i * 0.6180339) % 1) * W + jig, geo.standTop + ((i * 0.7548776) % 1) * standH, 4, 11);
      }
      ctx.globalAlpha = 1;
    }

    if (e.type === 'lights') {                       // 서치라이트 쇼
      const fade = Math.min(1, t * 6, (1 - t) * 5);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 6; i++) {
        const bx = W * (.1 + i * .16), ang = Math.sin(now / 700 + i * 1.3) * .5;
        const hue = [350, 220, 0, 210, 350, 220][i];
        const ex = bx + Math.sin(ang) * H, ey = geo.horizon - Math.cos(ang) * H;
        const g = ctx.createLinearGradient(bx, geo.horizon, ex, ey);
        g.addColorStop(0, `hsla(${hue},100%,70%,${.32 * fade})`); g.addColorStop(1, `hsla(${hue},100%,70%,0)`);
        ctx.fillStyle = g; ctx.beginPath();
        ctx.moveTo(bx - 8, geo.horizon); ctx.lineTo(bx + 8, geo.horizon);
        ctx.lineTo(ex + 70, ey); ctx.lineTo(ex - 70, ey); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    if (e.type === 'ball') {                         // 홈런 타구 궤적
      const hx = geo.diamond.home[0], hy = geo.diamond.home[1] - 10, tx = W * .58, ty = geo.horizon * .55;
      const bx = hx + (tx - hx) * t, by = hy + (ty - hy) * t - Math.sin(t * Math.PI) * H * .25;
      const r = Math.max(2, 9 * (1 - t));
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }

    if (e.type === 'phanatic') drawPhanatic(now, t);
  }

  // 불꽃놀이 파티클
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  Fx.parts = Fx.parts.filter(p => p.life > 0);
  for (const p of Fx.parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.life -= .014;
    ctx.fillStyle = `hsla(${p.hue},100%,65%,${Math.max(0, p.life)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}

function drawPhanatic(now, t) {
  const s = H * .09, x = -s + t * (W + s * 2), bob = Math.abs(Math.sin(now / 160)) * s * .18;
  const y = H * .53 + t * H * .05 - bob;
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 105 + bob * 100 / s, 70, 12, 0, 0, 7); ctx.fill();
  // 몸통 (털 질감)
  const g = ctx.createRadialGradient(-15, -15, 10, 0, 0, 90);
  g.addColorStop(0, '#6fd35a'); g.addColorStop(1, '#2b8a2e');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 20, 68, 82, 0, 0, 7); ctx.fill();
  for (let i = 0; i < 70; i++) {
    const a = i * 2.4, r = 60 + (i % 5) * 4;
    ctx.fillStyle = i % 2 ? '#3a9d36' : '#7fe06a';
    ctx.beginPath(); ctx.arc(Math.cos(a) * r * .9, 20 + Math.sin(a) * r * 1.05, 4, 0, 7); ctx.fill();
  }
  // 유니폼
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 52, 44, 38, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#E81828'; ctx.font = '900 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('P', 0, 62);
  // 팔 (흔들기)
  ctx.strokeStyle = '#3a9d36'; ctx.lineWidth = 18; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-58, 30); ctx.lineTo(-92, -10 - Math.sin(now / 120) * 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(58, 30); ctx.lineTo(92, 40); ctx.stroke();
  // 주둥이
  const sg = ctx.createLinearGradient(0, -30, 0, 10);
  sg.addColorStop(0, '#8bea74'); sg.addColorStop(1, '#3b9a38');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(34, -8, 62, 24, -.08, 0, 7); ctx.fill();
  ctx.fillStyle = '#E81828'; ctx.beginPath(); ctx.ellipse(44, 14, 34, 8, .1, 0, 7); ctx.fill();   // 혀
  ctx.fillStyle = '#134d17'; ctx.beginPath(); ctx.arc(86, -18, 4, 0, 7); ctx.fill();
  // 눈
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-4, -40, 17, 20, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(28, -40, 17, 20, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, -38, 6, 0, 7); ctx.arc(32, -38, 6, 0, 7); ctx.fill();
  // 머리 털
  ctx.strokeStyle = '#E81828'; ctx.lineWidth = 5;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(14 + i * 7, -60); ctx.lineTo(14 + i * 12, -92 - Math.abs(i) * -4); ctx.stroke(); }
  ctx.restore();
}
addEventListener('resize', resize);
resize(); updateBoard(); render(); frame();
</script>
